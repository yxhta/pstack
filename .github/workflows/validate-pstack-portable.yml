name: Validate portable pstack

on:
  push:
    paths:
      - 'pstack/**'
      - 'cursor-team-kit/skills/deslop/**'
      - 'cursor-team-kit/LICENSE'
      - 'portable/**'
      - 'README.md'
      - 'README_PORTABLE.md'
      - '.gitattributes'
      - 'tools/portable/**'
      - '.claude-plugin/**'
      - '.agents/plugins/**'
      - '.github/workflows/*pstack*.yml'
  pull_request:
    paths:
      - 'pstack/**'
      - 'cursor-team-kit/skills/deslop/**'
      - 'cursor-team-kit/LICENSE'
      - 'portable/**'
      - 'README.md'
      - 'README_PORTABLE.md'
      - '.gitattributes'
      - 'tools/portable/**'
      - '.claude-plugin/**'
      - '.agents/plugins/**'
      - '.github/workflows/*pstack*.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python3 tools/portable/validate.py
      - run: python3 -m unittest discover -s tools/portable -p 'test_*.py'
      - run: bash -n tools/portable/sync-upstream.sh
      - run: sh -n portable/pstack/hooks/session-start.sh
      - name: Install the skills for both agents in an isolated project
        run: |
          mkdir -p "$RUNNER_TEMP/pstack-skills-smoke"
          cd "$RUNNER_TEMP/pstack-skills-smoke"
          npx --yes skills add "$GITHUB_WORKSPACE/portable/pstack" --skill '*' --agent claude-code codex --copy --yes
          python3 "$GITHUB_WORKSPACE/tools/portable/check-install.py" "$RUNNER_TEMP/pstack-skills-smoke"
